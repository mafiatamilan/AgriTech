; ── AgriTech Irrigation Controller — PlatformIO Configuration ───────
; Two build environments:
;   controller  → ESP32 DevKit V1 + SX1278 (LoRa A) + Wi-Fi/MQTT
;   relay_unit  → Arduino UNO       + SX1278 (LoRa B) + relay

[platformio]
src_dir      = controller/src
default_envs = controller

; ── Shared build flags ──────────────────────────────────────────────
[common]
lib_deps =
    sandeepmistry/LoRa @ ^0.8.0
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^6.21
build_flags =
    -D LORA_FREQUENCY=433.0
    -D LORA_BANDWIDTH=125.0
    -D LORA_SPREAD_FACTOR=9
    -D LORA_TX_POWER=17
    -D LORA_SYNC_WORD=0x12
    -D LORA_RETRY_COUNT=3
    -D LORA_RETRY_DELAY_MS=1000
    -D HEARTBEAT_INTERVAL_MS=60000
    -D SAFETY_TIMEOUT_MS=1800000

; ── ESP32 Controller ────────────────────────────────────────────────
[env:controller]
platform = espressif32
board    = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed  = 921600
src_filter    = +<../shared/> +<main.cpp>

lib_deps =
    ${common.lib_deps}
    ; WiFiManager for captive-portal provisioning
    tzapu/WiFiManager @ ^2.0.17

build_flags =
    ${common.build_flags}
    ; ── Wi-Fi (override at build-time or use WiFiManager) ──────────
    -D WIFI_SSID=\"your-ssid\"
    -D WIFI_PASS=\"your-password\"
    ; ── MQTT ───────────────────────────────────────────────────────
    -D MQTT_BROKER=\"broker.emqx.io\"
    -D MQTT_PORT=1883
    -D MQTT_USER=\"\"
    -D MQTT_PASS=\"\"
    ; ── LoRa A pins (ESP32 ↔ SX1278) ──────────────────────────────
    -D LORA_SCK=18
    -D LORA_MISO=19
    -D LORA_MOSI=23
    -D LORA_CS=5
    -D LORA_RST=14
    -D LORA_DIO0=26

; ── Arduino UNO Relay Unit ──────────────────────────────────────────
[env:relay_unit]
platform = atmelavr
board    = uno
framework = arduino
monitor_speed = 9600
src_filter    = +<../shared/> +<main.cpp>

lib_deps =
    ${common.lib_deps}

build_flags =
    ${common.build_flags}
    ; ── LoRa B pins (UNO ↔ SX1278) ────────────────────────────────
    -D LORA_SCK=13
    -D LORA_MISO=12
    -D LORA_MOSI=11
    -D LORA_CS=10
    -D LORA_RST=9
    -D LORA_DIO0=2
    ; ── Relay pin ──────────────────────────────────────────────────
    -D RELAY_PIN=7
    -D RELAY_ACTIVE_HIGH=1
    ; ── Safety ─────────────────────────────────────────────────────
    -D SAFETY_TIMEOUT_MS=1800000
